</style></head><body><div class="bespoke-marp-osc"><button data-bespoke-marp-osc="prev" tabindex="-1" title="Previous slide">Previous slide</button><span data-bespoke-marp-osc="page"></span><button data-bespoke-marp-osc="next" tabindex="-1" title="Next slide">Next slide</button><button data-bespoke-marp-osc="fullscreen" tabindex="-1" title="Toggle fullscreen (f)">Toggle fullscreen</button><button data-bespoke-marp-osc="overview" tabindex="-1" title="Toggle overview view (o)">Toggle overview view</button><button data-bespoke-marp-osc="presenter" tabindex="-1" title="Open presenter view (p)">Open presenter view</button></div><div id=":$p"><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="1" data-class="title" data-theme="oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr" lang="en-US" class="title" style="--class:title;--theme:oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr;"><div class="c1"></div><div class="c2"></div><div class="c3"></div>
<p><span class="eyebrow">QMS training · Audit &amp; CAPA</span></p>
<h1 id="audit-and-capa-strongstep-by-stepstrong">Audit and CAPA, <strong>step by step</strong></h1>
<p>From the real-life story to every screen and setting. Follows one audit at Cedar Valley Components, an invented company.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-class="divider" data-theme="oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr" lang="en-US" class="divider" data-marpit-pagination="2" style="--paginate:true;--class:divider;--theme:oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr;" data-marpit-pagination-total="40">
<p><span class="eyebrow">Part 1 · Chapters 01 to 04</span></p>
<h1 id="in-real-life">In real life</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-class="diagram" data-theme="oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr" lang="en-US" class="diagram" data-marpit-pagination="3" style="--paginate:true;--class:diagram;--theme:oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr;" data-marpit-pagination-total="40">
<p><span class="eyebrow">Level 1 · Chapter 01</span></p>
<h2 id="why-companies-audit-themselves">Why companies audit themselves</h2>
<div class="split">
<div><strong>A system nobody checks drifts.</strong> People find shortcuts, products outgrow checklists, owners change jobs. Nobody means harm. It happens to every set of rules.</div>
<div><strong>An internal audit asks two questions.</strong> Do we do what our rules say? Do the rules work? Auditors from other departments look, read records and ask. ISO 9001 requires it.</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-class="diagram" data-theme="oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr" lang="en-US" class="diagram" data-marpit-pagination="4" style="--paginate:true;--class:diagram;--theme:oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr;" data-marpit-pagination-total="40">
<p><span class="eyebrow">Level 1 · Chapter 02</span></p>
<h2 id="how-an-internal-audit-works">How an internal audit works</h2>
<div class="flow">
<div class="s">Rules<small>Priya</small></div><span>→</span>
<div class="s">Program<small>Priya, Marco</small></div><span>→</span>
<div class="s">Plan<small>Marco</small></div><span>→</span>
<div class="s">Evidence<small>Tom</small></div><span>→</span>
<div class="s on">Audit<small>Sam, Lina</small></div><span>→</span>
<div class="s">Sign-off<small>Marco</small></div>
</div>
<div class="split">
<div>Four requirements from Cedar Valley's own procedures, for example "Measuring equipment is calibrated every 12 months".</div>
<div>One test for R1: sample 10 calibration records from the last quarter, collected before the audit day.</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-class="diagram" data-theme="oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr" lang="en-US" class="diagram" data-marpit-pagination="5" style="--paginate:true;--class:diagram;--theme:oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr;" data-marpit-pagination-total="40">
<p><span class="eyebrow">Level 1 · Chapter 02</span></p>
<h2 id="three-findings-at-cedar-valley">Three findings at Cedar Valley</h2>
<table>
<thead>
<tr>
<th>Type</th>
<th>Finding</th>
<th>Route</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Major</strong></td>
<td>4 of 12 gauges overdue, two used to accept parts</td>
<td>CAPA</td>
</tr>
<tr>
<td><strong>Minor</strong></td>
<td>station 5 shows an old revision of WI-214</td>
<td>quality event</td>
</tr>
<tr>
<td><strong>Observation</strong></td>
<td>calibration records kept in two spreadsheets</td>
<td>recorded only</td>
</tr>
</tbody>
</table>
<p class="note">The fourth type, Non-conformity, is for companies that do not grade major and minor.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-class="diagram" data-theme="oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr" lang="en-US" class="diagram" data-marpit-pagination="6" style="--paginate:true;--class:diagram;--theme:oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr;" data-marpit-pagination-total="40">
<p><span class="eyebrow">Level 1 · Chapter 03</span></p>
<h2 id="three-kinds-of-fix">Three kinds of fix</h2>
<table>
<thead>
<tr>
<th>Kind</th>
<th>Does</th>
<th>Cedar Valley</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Correction</strong></td>
<td>fixes the problem today</td>
<td>recalibrate the 4 gauges, re-check the parts</td>
</tr>
<tr>
<td><strong>Corrective action</strong></td>
<td>removes the cause</td>
<td>an owner for the calibration list, with reminders</td>
</tr>
<tr>
<td><strong>Preventive action</strong></td>
<td>removes the cause where it has not hit yet</td>
<td>the same at the Hillcrest plant</td>
</tr>
</tbody>
</table>
<p class="note">A correction alone brings the problem back next year.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="diagram" data-theme="oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr" lang="en-US" class="diagram" data-marpit-pagination="7" style="--paginate:true;--class:diagram;--theme:oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr;" data-marpit-pagination-total="40">
<p><span class="eyebrow">Level 1 · Chapter 03</span></p>
<h2 id="from-finding-to-fix-capa">From finding to fix: CAPA</h2>
<div class="flow">
<div class="s">Accept<small>Elena</small></div><span>→</span>
<div class="s on">Root cause<small>Ahmed</small></div><span>→</span>
<div class="s">Plan<small>Ahmed, Elena</small></div><span>→</span>
<div class="s">Do<small>Jonas</small></div><span>→</span>
<div class="s">Check<small>Lina</small></div><span>→</span>
<div class="s">Close<small>Elena</small></div>
</div>
<div class="split">
<div><strong>5 Whys.</strong> Overdue, because nobody noticed, because nobody owned the calibration list. Blaming the operator would change nothing.</div>
<div><strong>Check later.</strong> Months after the fix in real life. If it failed, the actions are redone in the same CAPA.</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-class="diagram" data-theme="oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr" lang="en-US" class="diagram" data-marpit-pagination="8" style="--paginate:true;--class:diagram;--theme:oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr;" data-marpit-pagination-total="40">
<p><span class="eyebrow">Level 1 · Chapter 04</span></p>
<h2 id="not-every-finding-needs-a-capa">Not every finding needs a CAPA</h2>
<div class="split">
<div><strong>Quality event</strong> for the old work instruction. One station, one copy, the rest of document control works. Elena picks "fix now, with one action". Grace's team replaces the copy.</div>
<div><strong>Observation</strong> for the two spreadsheets. Nothing is broken today. It stays in the report, and next year's audit looks again.<br /><br />Two slips of the same kind are a pattern. A pattern needs a CAPA.</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="divider" data-theme="oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr" lang="en-US" class="divider" data-marpit-pagination="9" style="--paginate:true;--class:divider;--theme:oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr;" data-marpit-pagination-total="40">
<p><span class="eyebrow">Part 2 · Chapters 05 to 14</span></p>
<h1 id="in-the-product">In the product</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="shot" data-theme="oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr" lang="en-US" class="shot" data-marpit-pagination="10" style="--paginate:true;--class:shot;--theme:oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr;" data-marpit-pagination-total="40">
<p><span class="eyebrow">Level 2 · Chapter 05</span></p>
<h2 id="where-the-work-starts">Where the work starts</h2>
<div class="sg">
<div class="frame"><img src="../img/01-qms-apps.png" /><span class="co" style="left:2.2%;top:28%">1</span><span class="co" style="left:49%;top:41%">2</span><span class="co" style="left:64.4%;top:41%">3</span><span class="co" style="left:29.3%;top:70%">4</span></div>
<div>
<ol class="lg">
<li>Apps, then Quality Management System.</li>
<li>Audit Management.</li>
<li>CAPA, with New CAPA.</li>
<li>Quality Event.</li>
</ol>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-class="shot" data-theme="oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr" lang="en-US" class="shot" data-marpit-pagination="11" style="--paginate:true;--class:shot;--theme:oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr;" data-marpit-pagination-total="40">
<p><span class="eyebrow">Level 2 · Chapter 05</span></p>
<h2 id="where-the-work-arrives">Where the work arrives</h2>
<div class="sg">
<div class="frame"><img src="../img/02-todo.png" /><span class="co" style="left:2.2%;top:15.2%">1</span><span class="co" style="left:24%;top:42%">2</span><span class="co" style="left:42.8%;top:41%">3</span><span class="co" style="left:50%;top:41%">4</span></div>
<div>
<ol class="lg">
<li>To Do holds every task.</li>
<li>The subject names the step and the record.</li>
<li>New, Draft once opened, Completed.</li>
<li>Sent by: who passed it on.</li>
</ol>
<p class="note">Every task ends the same way: Task Resolution, then Submit.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-class="shot" data-theme="oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr" lang="en-US" class="shot" data-marpit-pagination="12" style="--paginate:true;--class:shot;--theme:oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr;" data-marpit-pagination-total="40">
<p><span class="eyebrow">Level 2 · Chapter 06</span></p>
<h2 id="a-requirement">A requirement</h2>
<div class="sg tall">
<div class="frame"><img src="../img/03-requirement-r1.png" /><span class="co" style="left:59.5%;top:16.5%">1</span><span class="co" style="left:64.6%;top:23.1%">2</span><span class="co" style="left:36.7%;top:53.5%">3</span><span class="co" style="left:23.4%;top:75.3%">4</span></div>
<div>
<p>Requirement Management &gt; Create a Requirement.</p>
<ol class="lg">
<li>Requirement Name: the rule in one sentence.</li>
<li>Linked Test(s): the proof it needs.</li>
<li>Description: where the rule comes from.</li>
<li>Validation Checklist: questions for audit day.</li>
</ol>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="shot" data-theme="oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr" lang="en-US" class="shot" data-marpit-pagination="13" style="--paginate:true;--class:shot;--theme:oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr;" data-marpit-pagination-total="40">
<p><span class="eyebrow">Level 2 · Chapter 06</span></p>
<h2 id="how-much-proof-is-enough">How much proof is enough</h2>
<div class="sg wide">
<div class="frame"><img src="../img/05-test-evidence.png" /><span class="co" style="left:34.2%;top:89%">1</span><span class="co" style="left:46.4%;top:89%">2</span><span class="co" style="left:54.2%;top:89%">3</span></div>
<ol class="lg">
<li>Sample Size: 10 records.</li>
<li>Population: all gauges on Line 2.</li>
<li>Frequency: how often to collect.</li>
</ol>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="shot" data-theme="oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr" lang="en-US" class="shot" data-marpit-pagination="14" style="--paginate:true;--class:shot;--theme:oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr;" data-marpit-pagination-total="40">
<p><span class="eyebrow">Level 2 · Chapter 07</span></p>
<h2 id="an-audit-program">An audit program</h2>
<div class="sg">
<div class="frame"><img src="../img/07-create-audit-program.png" /><span class="co" style="left:27.5%;top:20%">1</span><span class="co" style="left:65%;top:35.2%">2</span><span class="co" style="left:28%;top:48.6%">3</span><span class="co" style="left:55%;top:55%">4</span></div>
<div>
<p>Create Audit Program. The page header says New Audit Definition.</p>
<ol class="lg">
<li>Copy last year's program.</li>
<li>Audit Name.</li>
<li>Audit Type and Category.</li>
<li>Frequency.</li>
</ol>
<p class="note">Further down: the team, and the requirements to check.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="shot" data-theme="oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr" lang="en-US" class="shot" data-marpit-pagination="15" style="--paginate:true;--class:shot;--theme:oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr;" data-marpit-pagination-total="40">
<p><span class="eyebrow">Level 2 · Chapter 07</span></p>
<h2 id="the-team-leader-approves">The team leader approves</h2>
<div class="sg tall">
<div class="frame"><img src="../img/09-review-audit-program.png" /><span class="co" style="left:55.7%;top:2.7%">1</span><span class="co" style="left:17%;top:20.7%">2</span><span class="co" style="left:58.6%;top:87.9%">3</span></div>
<div>
<p>Marco gets Review the Audit Program.</p>
<ol class="lg">
<li>The task subject names the program.</li>
<li>The program has its Audit ID now.</li>
<li>Approve makes it ready to plan. Reject sends it back to Priya.</li>
</ol>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-class="shot" data-theme="oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr" lang="en-US" class="shot" data-marpit-pagination="16" style="--paginate:true;--class:shot;--theme:oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr;" data-marpit-pagination-total="40">
<p><span class="eyebrow">Level 2 · Chapter 08</span></p>
<h2 id="plan-the-audit">Plan the audit</h2>
<div class="sg tall">
<div class="frame"><img src="../img/11-new-audit-plan.png" /><span class="co" style="left:6.6%;top:27%">1</span><span class="co" style="left:11.4%;top:72.6%">2</span><span class="co" style="left:88.4%;top:97%">3</span></div>
<div>
<p>Manage Audit Schedules &gt; Add. Only the program's team leader can plan it.</p>
<ol class="lg">
<li>Add picks the program.</li>
<li>Planned and actual start dates.</li>
<li>Save and Close. On the start date, the next task arrives.</li>
</ol>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-class="shot" data-theme="oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr" lang="en-US" class="shot" data-marpit-pagination="17" style="--paginate:true;--class:shot;--theme:oatc11ounfiwoijov0qibzc4lhq0o0phtttwxfyxr;" data-marpit-pagination-total="40">
<p><span class="eyebrow">Level 2 · Chapter 08</span></p>
<h2 id="name-the-people">Name the people</h2>
<div class="sg tall">
<div class="frame"><img src="../img/12-schedule-audit.png" /><span class="co" style="left:4%;top:36.7%">1</span><span class="co" style="left:49.5%;top:36.6%">2</span><span class="co" style="left:49.5%;top:43.2%">3</span><span class="co" style="left:49.5%;top:50%">4</span><span class="co" style="left:49.5%;top:97%">5</span></div>
<div>
<p>Schedule Audit, for the audit owner.</p>
<ol class="lg">
<li>Participant Auditors.</li>
<li>Lead Auditor.</li>
<li>Lead Evidence Collector.</li>
<li>Auditees: emails only.</li>
<li>Establish Contact, then Submit.</li>
</ol>
</div>
